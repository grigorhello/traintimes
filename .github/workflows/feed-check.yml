name: Feed check (temporary, TT-131)
on:
  push:
    branches: [claude/project-thread-ej1d1f]
    paths: ['.github/feed-check/**', '.github/workflows/feed-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gtfs-realtime-bindings==1.0.0
      - run: python .github/feed-check/check2.py
