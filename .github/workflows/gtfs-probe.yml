name: GTFS probe (temporary, TT-130)

on:
  push:
    branches: [claude/project-thread-5eloxy]
    paths: [.github/workflows/gtfs-probe.yml, scripts/gtfs-probe.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download
        run: |
          curl -sSL -D headers.txt -o /tmp/go.zip "https://assets.metrolinx.com/raw/upload/Documents/Metrolinx/Open%20Data/GO-GTFS.zip"
          cat headers.txt
          ls -la /tmp/go.zip
      - name: Probe
        run: python3 scripts/gtfs-probe.py /tmp/go.zip gtfs-probe
      - name: Commit the rail subset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp headers.txt gtfs-probe/
          git add gtfs-probe
          git commit -m "GTFS probe: rail subset of the GO feed (temporary, TT-130)"
          git push origin HEAD:claude/project-thread-5eloxy
