<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule at the xxxLarge Dynamic Type size</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="gt-theme.css">
<link rel="stylesheet" href="ds/go-train-app/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="phone lt {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-system)">

  <div class="navbar">
    <span class="nav-title">Train Times</span>
    <button class="icon-btn" aria-label="Settings"><span class="ico i-gear" aria-hidden="true"></span></button>
  </div>

  <div class="screen">
    <div class="rh">
      <div class="names">
        <span class="route">Oakville to Union</span>
        <span class="line subhead"><span class="dot" aria-hidden="true"></span>Lakeshore West</span>
      </div>
      <div class="acts">
        <button class="icon-btn" aria-label="Swap direction"><span class="ico i-swap" aria-hidden="true"></span></button>
        <button class="icon-btn on" aria-label="Remove from favourites"><span class="ico i-star-fill" aria-hidden="true"></span></button>
      </div>
    </div>

    <div class="days" role="tablist" aria-label="Service day">
      <button class="dayc sel" role="tab" aria-selected="true"><span class="footnote">Today</span><span class="headline tnum">5</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Friday, November 6"><span class="footnote">Fri</span><span class="headline tnum">6</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Saturday, November 7"><span class="footnote">Sat</span><span class="headline tnum">7</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Sunday, November 8"><span class="footnote">Sun</span><span class="headline tnum">8</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Monday, November 9"><span class="footnote">Mon</span><span class="headline tnum">9</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Tuesday, November 10"><span class="footnote">Tue</span><span class="headline tnum">10</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Wednesday, November 11"><span class="footnote">Wed</span><span class="headline tnum">11</span></button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: -4px">
      <span class="fresh footnote">Updated just now</span>
      <button class="jump footnote" aria-label="Back to now, today"><span class="ico sm i-clock" aria-hidden="true"></span>Now</button>
    </div>

    <div class="tl" role="list" aria-label="Departures, 7:21 AM onwards">
      <div class="tl-rail" style="height: 100%" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 77px" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 184px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 172px" aria-hidden="true">7:45</span>
      <div class="tl-tick" style="top: 295px" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 400px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 388px" aria-hidden="true">8:15</span>
      <div class="tl-tick" style="top: 505px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 493px" aria-hidden="true">8:30</span>
      <div class="tl-now" style="top: 13px" aria-hidden="true"></div><span class="tl-lbl tl-nowlbl footnote" style="top: 2px" aria-hidden="true">Now</span>

      <span class="tl-pill lead footnote tnum" style="top: 77px" aria-hidden="true">7:32</span>
      <span class="tl-mark lead" style="top: 83px" aria-hidden="true"></span>
      <div class="tl-link lead" style="top: 90px" aria-hidden="true"></div>
      <div class="dep lead" style="top: 51px" role="listitem">
        <a class="when" href="Trip-Details.dc.html" aria-label="7:32 AM to Union, in 11 minutes, on time, scheduled arrival 8:12 AM, platform 2"><span class="time-lead tnum time">7:32 AM</span></a>
        <div class="arr"><span class="lbl footnote">Scheduled arrival</span><span class="time-arrival tnum">8:12 AM</span><span class="footnote muted">Platform 2</span></div>
        <div class="meta"><span class="badge ontime"><span class="ico sm i-check" aria-hidden="true"></span>On time</span><span class="footnote soon tnum">in 11 min</span><button class="icon-btn bell" aria-label="Alert for 7:32 AM train"><span class="ico i-bell" aria-hidden="true"></span></button></div>
      </div>

      <span class="tl-pill footnote tnum" style="top: 267px" aria-hidden="true">7:58</span>
      <span class="tl-mark" style="top: 275px" aria-hidden="true"></span>
      <div class="tl-link" style="top: 280px" aria-hidden="true"></div>
      <div class="dep" style="top: 243px" role="listitem">
        <a class="when" href="Trip-Details.dc.html" aria-label="7:58 AM to Union, on time, scheduled arrival 8:38 AM, platform pending"><span class="time-row tnum time">7:58 AM</span></a>
        <div class="arr"><span class="lbl footnote">Scheduled arrival</span><span class="time-arrival tnum">8:38 AM</span></div>
        <div class="meta"><span class="badge ontime"><span class="ico sm i-check" aria-hidden="true"></span>On time</span><span class="footnote muted">Platform pending</span><button class="icon-btn bell" aria-label="Alert for 7:58 AM train"><span class="ico i-bell" aria-hidden="true"></span></button></div>
      </div>

      <span class="tl-pill footnote tnum" style="top: 428px" aria-hidden="true">8:21</span>
      <span class="tl-mark" style="top: 436px" aria-hidden="true"></span>
      <div class="tl-link" style="top: 441px" aria-hidden="true"></div>
      <div class="dep" style="top: 404px" role="listitem">
        <a class="when" href="Trip-Details.dc.html" aria-label="8:21 AM to Union, scheduled, scheduled arrival 9:01 AM, express"><span class="time-row tnum time">8:21 AM</span></a>
        <div class="arr"><span class="lbl footnote">Scheduled arrival</span><span class="time-arrival tnum">9:01 AM</span></div>
        <div class="meta"><span class="badge sched"><span class="ico sm i-clock" aria-hidden="true"></span>Scheduled</span><span class="tag footnote"><span class="ico sm i-express" aria-hidden="true"></span><span class="tag-text">Express</span></span><button class="icon-btn bell" aria-label="Alert for 8:21 AM train"><span class="ico i-bell" aria-hidden="true"></span></button></div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a class="sel" href="Main.dc.html" aria-current="page"><span class="ico i-list" aria-hidden="true"></span><span class="tab-label">Schedule</span></a>
    <a href="Alerts.dc.html"><span class="ico i-bell" aria-hidden="true"></span><span class="tab-label">Alerts</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
