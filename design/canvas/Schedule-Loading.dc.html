<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule loading the first timetable</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="gt-theme.css">
<link rel="stylesheet" href="ds/go-train-app/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.tl-pill.skel{background:var(--surface-raised);color:transparent}
.tl-mark.skel{box-shadow:inset 0 0 0 2px var(--hairline)}
.tl-link.skel{border-top-color:var(--hairline)}
</style>
</helmet>
<div class="phone {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-system)">

  <div class="navbar">
    <span class="nav-title">Train Times</span>
    <button class="icon-btn" aria-label="Settings"><span class="ico i-gear" aria-hidden="true"></span></button>
  </div>

  <div class="screen">
    <div class="rh">
      <div class="names">
        <span class="route">Oakville to Union</span>
        <span class="line subhead"><span class="dot" aria-hidden="true"></span>Lakeshore West</span>
      </div>
      <div class="acts">
        <button class="icon-btn" aria-label="Swap direction"><span class="ico i-swap" aria-hidden="true"></span></button>
        <button class="icon-btn" aria-label="Add to favourites"><span class="ico i-star" aria-hidden="true"></span></button>
      </div>
    </div>

    <div class="days" role="tablist" aria-label="Service day">
      <button class="dayc sel" role="tab" aria-selected="true"><span class="footnote">Today</span><span class="headline tnum">5</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Friday, November 6"><span class="footnote">Fri</span><span class="headline tnum">6</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Saturday, November 7"><span class="footnote">Sat</span><span class="headline tnum">7</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Sunday, November 8"><span class="footnote">Sun</span><span class="headline tnum">8</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Monday, November 9"><span class="footnote">Mon</span><span class="headline tnum">9</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Tuesday, November 10"><span class="footnote">Tue</span><span class="headline tnum">10</span></button>
      <button class="dayc" role="tab" aria-selected="false" aria-label="Wednesday, November 11"><span class="footnote">Wed</span><span class="headline tnum">11</span></button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: -4px">
      <span class="fresh footnote">Loading timetable</span>
      <button class="jump footnote" aria-label="Back to now, today" style="color: var(--ink-tertiary)"><span class="ico sm i-clock" aria-hidden="true"></span>Now</button>
    </div>

    <div class="tl" aria-busy="true" aria-label="Loading departures">
      <div class="tl-rail" style="height: 100%" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 77px" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 182px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 173px" aria-hidden="true">7:45</span>
      <div class="tl-tick" style="top: 287px" aria-hidden="true"></div>
      <div class="tl-tick" style="top: 392px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 383px" aria-hidden="true">8:15</span>
      <div class="tl-tick" style="top: 497px" aria-hidden="true"></div><span class="tl-lbl footnote tnum" style="top: 488px" aria-hidden="true">8:30</span>
      <div class="tl-now" style="top: 13px" aria-hidden="true"></div><span class="tl-lbl tl-nowlbl footnote" style="top: 5px" aria-hidden="true">Now</span>

      <span class="tl-pill skel footnote" style="top: 80px" aria-hidden="true">0:00</span>
      <span class="tl-mark skel" style="top: 85px" aria-hidden="true"></span>
      <div class="tl-link skel" style="top: 90px" aria-hidden="true"></div>
      <div class="dep" style="top: 56px" aria-hidden="true">
        <div class="when" style="gap: 8px; padding-top: 4px"><span class="skel" style="width: 150px; height: 32px"></span></div>
        <div class="arr" style="gap: 8px; align-items: end"><span class="skel" style="width: 96px; height: 12px"></span><span class="skel" style="width: 70px; height: 18px"></span></div>
        <div class="meta" style="gap: 8px"><span class="skel" style="width: 90px; height: 24px; border-radius: 9999px"></span><span class="skel" style="width: 70px; height: 12px"></span></div>
      </div>

      <span class="tl-pill skel footnote" style="top: 262px" aria-hidden="true">0:00</span>
      <span class="tl-mark skel" style="top: 267px" aria-hidden="true"></span>
      <div class="tl-link skel" style="top: 272px" aria-hidden="true"></div>
      <div class="dep" style="top: 240px" aria-hidden="true">
        <div class="when" style="gap: 8px; padding-top: 4px"><span class="skel" style="width: 130px; height: 30px"></span></div>
        <div class="arr" style="gap: 8px; align-items: end"><span class="skel" style="width: 96px; height: 12px"></span><span class="skel" style="width: 70px; height: 18px"></span></div>
        <div class="meta" style="gap: 8px"><span class="skel" style="width: 90px; height: 24px; border-radius: 9999px"></span><span class="skel" style="width: 70px; height: 12px"></span></div>
      </div>

      <span class="tl-pill skel footnote" style="top: 423px" aria-hidden="true">0:00</span>
      <span class="tl-mark skel" style="top: 428px" aria-hidden="true"></span>
      <div class="tl-link skel" style="top: 433px" aria-hidden="true"></div>
      <div class="dep" style="top: 401px" aria-hidden="true">
        <div class="when" style="gap: 8px; padding-top: 4px"><span class="skel" style="width: 130px; height: 30px"></span></div>
        <div class="arr" style="gap: 8px; align-items: end"><span class="skel" style="width: 96px; height: 12px"></span><span class="skel" style="width: 70px; height: 18px"></span></div>
        <div class="meta" style="gap: 8px"><span class="skel" style="width: 90px; height: 24px; border-radius: 9999px"></span><span class="skel" style="width: 70px; height: 12px"></span></div>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a class="sel" href="Main.dc.html" aria-current="page"><span class="ico i-list" aria-hidden="true"></span><span class="tab-label">Schedule</span></a>
    <a href="Alerts.dc.html"><span class="ico i-bell" aria-hidden="true"></span><span class="tab-label">Alerts</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Appearance"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? 'light') === 'dark' ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
