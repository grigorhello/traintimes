# Train Times alert server (TT-140, D38). Setup and deploy steps: README.md.
name = "traintimes-alerts"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# The app's API at https://alerts.traintimes.ca (traintimes.ca is a zone on the same Cloudflare account).
routes = [{ pattern = "alerts.traintimes.ca", custom_domain = true }]

[triggers]
# Every minute: the monitoring cycle. Daily at 3:17 AM EST (4:17 AM EDT): retention (DAILY in src/index.ts).
crons = ["* * * * *", "17 8 * * *"]

# Workers Free plan (D43): 10 ms of CPU and 50 outside requests per run, 100,000 requests a day; D1 Free: 5 million
# rows read and 100,000 written a day. The timetable import (about 2 s of CPU) runs in GitHub Actions instead
# (.github/workflows/server-timetable.yml), and a minute cycle reads only what it watches (src/monitor.ts).

[vars]
APNS_TOPIC = "ca.traintimes.TrainTimes"
# GO's GTFS-realtime feeds, relayed to the app through src/relay.ts (D88). The key is the secret METROLINX_API_KEY.
GO_FEEDS_URL = "https://api.openmetrolinx.com/OpenDataAPI/api/V1/Gtfs/Feed/"
# The workflow whose GitHub OIDC token may upload timetables (src/upload.ts).
TIMETABLE_WORKFLOW = "grigorhello/traintimes/.github/workflows/server-timetable.yml@refs/heads/main"

[[d1_databases]]
binding = "DB"
database_name = "traintimes-alerts"
# Created 2026-11-08 (README.md, Deployed).
database_id = "7be39f88-bd9d-4bd9-87b9-9b9d719d3c36"
